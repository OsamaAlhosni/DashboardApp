<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DashboardApp</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-8">
    <div class="max-w-4xl mx-auto">
        <header class="mb-8">
            <h1 class="text-3xl font-bold">DashboardApp Control Panel</h1>
            <p class="text-slate-400">Real-time system metrics and logs</p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-slate-800 p-6 rounded-xl border border-slate-700">
                <h3 class="text-sm font-medium text-slate-400">Total Users</h3>
                <p id="total-users" class="text-3xl font-bold mt-2">Loading...</p>
            </div>
            <div class="bg-slate-800 p-6 rounded-xl border border-slate-700">
                <h3 class="text-sm font-medium text-slate-400">Active Sessions</h3>
                <p id="active-sessions" class="text-3xl font-bold mt-2">Loading...</p>
            </div>
            <div class="bg-slate-800 p-6 rounded-xl border border-slate-700">
                <h3 class="text-sm font-medium text-slate-400">System Health</h3>
                <p id="system-health" class="text-3xl font-bold mt-2 text-emerald-400">Loading...</p>
            </div>
        </div>

        <div class="bg-slate-800 rounded-xl border border-slate-700 p-6">
            <h2 class="text-xl font-bold mb-4">System Logs</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-slate-700 text-slate-400 text-sm">
                            <th class="py-3 px-4">Timestamp</th>
                            <th class="py-3 px-4">Level</th>
                            <th class="py-3 px-4">Message</th>
                        </tr>
                    </thead>
                    <tbody id="logs-table" class="divide-y divide-slate-700 text-sm">
                        <tr><td colspan="3" class="py-4 text-center text-slate-400">Loading logs...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        async function fetchDashboardData() {
            try {
                // Fetch metrics
                const metricsRes = await fetch('http://127.0.0.1:8000/api/metrics/');
                const metrics = await metricsRes.json();
                document.getElementById('total-users').innerText = metrics.total_users;
                document.getElementById('active-sessions').innerText = metrics.active_sessions;
                document.getElementById('system-health').innerText = metrics.system_health;

                // Fetch logs
                const logsRes = await fetch('http://127.0.0.1:8000/api/logs/');
                const logs = await logsRes.json();
                const tbody = document.getElementById('logs-table');
                tbody.innerHTML = '';
                logs.forEach(log => {
                    const row = document.createElement('tr');
                    const colorClass = log.level === 'WARNING' ? 'text-amber-400' : 'text-slate-300';
                    row.innerHTML = `
                        <td class="py-3 px-4 font-mono text-xs text-slate-400">${log.timestamp}</td>
                        <td class="py-3 px-4 font-semibold ${colorClass}">${log.level}</td>
                        <td class="py-3 px-4 ${colorClass}">${log.message}</td>
                    `;
                    tbody.appendChild(row);
                });
            } catch (err) {
                console.error('Error fetching dashboard data:', err);
            }
        }

        fetchDashboardData();
        setInterval(fetchDashboardData, 5000);
    </script>
</body>
</html>
